[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "monarch-causal-circuits"
version = "0.1.0"
description = "An implementation of monarch causal circuits in pytorch"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [
  {name = "Amirsaman Bozorgvar", email = "amirsaman.bozorgvar@stud.tu-darmstadt.de"},
]
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "torch",
    "networkx",
    "scipy",
    "torch-semiring-einsum",
    "graphviz",
    "colorlog",
]

[project.optional-dependencies]
test = [
    "pytest"
]
dev = [
    "ruff"
]
wandb = [
    "wandb"
]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long, handled by formatter
]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]



